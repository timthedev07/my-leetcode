name: CI

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit and integration tests
        run: yarn test

      - name: Build Electron application
        run: yarn build

      - name: Electron smoke test
        run: yarn test:e2e
